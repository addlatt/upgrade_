# V1b / R21 — alongside-install kickstart for the HYPER-V MOK LEG (SB on,
# MicrosoftUEFICertificateAuthority template). Derived from rig/vm/v1b-ks.cfg;
# deltas: hostname, mokutil in %packages, an early %post --nochroot that
# copies win-pca.der (Microsoft Windows Production PCA 2011, extracted from
# this guest's own bootmgfw.efi signature) from OEMDRV, and a %post step that
# queues it for MokList enrolment (mokutil --import, password rigmok12 —
# MokManager still asks for it interactively at the next boot, driven over
# the WMI keyboard). See rig/hyperv/README.md.
#
# Installs Fedora into the space freed by shrinking the guest's C:, REUSING
# the Windows-made ESP (sda1) as /boot/efi WITHOUT reformatting it, and
# touching nothing else on the disk. Anaconda auto-loads this file from a
# volume labelled OEMDRV (v1b.sh oemdrv builds it) — no inst.ks= needed.
#
# Rig-only: Secure Boot is OFF on this host (SMM crashes KVM, see
# rig/vm/README.md). A green run closes plumbing, never R21's SB / vendor
# clauses. Deliberate deviations from a stock install, all recorded:
#   - bootloader --timeout=30 so the GRUB menu can be driven over QMP
#   - %post records the STOCK os-prober state, then sets
#     GRUB_DISABLE_OS_PROBER=false and regenerates (what the converter would do)
#   - a boot-marker unit appends a row to OEMDRV:/boots.log on every boot
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
rootpw --plaintext rig
user --name=rig --password=rig --plaintext --groups=wheel
network --bootproto=dhcp --device=link --activate --hostname=upgrigmok-linux
url --url=https://archives.fedoraproject.org/pub/archive/fedora/linux/releases/42/Everything/x86_64/os/
selinux --enforcing
firewall --enabled

# --- the alongside layout --------------------------------------------------
ignoredisk --only-use=sda
clearpart --none
bootloader --location=mbr --boot-drive=sda --timeout=30
part /boot/efi --onpart=sda1 --noformat
part /boot --fstype=ext4 --size=1024 --ondisk=sda
part /     --fstype=ext4 --size=4096 --grow --ondisk=sda

poweroff

%packages
@core
grub2-efi-x64
shim-x64
efibootmgr
os-prober
ntfs-3g
mokutil
%end

%post --nochroot
# stage the Windows Production PCA (from OEMDRV) into the chroot for mokutil
dev=/dev/disk/by-label/OEMDRV
mkdir -p /mnt/oemdrv
mountpoint -q /mnt/oemdrv || mount "$dev" /mnt/oemdrv
cp /mnt/oemdrv/win-pca.der /mnt/sysroot/root/win-pca.der || true
%end

%post --log=/root/v1b-post.log
set -x
echo "== v1b %post $(date -u +%FT%TZ) ==="
echo "== stock /etc/default/grub"
cat /etc/default/grub
echo "== stock grub.cfg: lines mentioning Windows: $(grep -c -i windows /boot/grub2/grub.cfg)"
grep -n -i windows /boot/grub2/grub.cfg || true
echo "== os-prober (run by hand, stock)"
os-prober || echo "os-prober exit $?"
echo "== efibootmgr -v"
efibootmgr -v
echo "== ESP after install"
df -B1 /boot/efi
find /boot/efi -type f -printf '%s %p\n' | sort -k2
sha256sum /boot/efi/EFI/Microsoft/Boot/bootmgfw.efi
echo "== ESP bytes under EFI/fedora + EFI/BOOT (what the install added)"
du -sb /boot/efi/EFI/fedora /boot/efi/EFI/BOOT || true

# What the converter would do explicitly: make sure os-prober runs for grub2-mkconfig.
if grep -q '^GRUB_DISABLE_OS_PROBER=' /etc/default/grub; then
    sed -i 's/^GRUB_DISABLE_OS_PROBER=.*/GRUB_DISABLE_OS_PROBER=false/' /etc/default/grub
else
    echo 'GRUB_DISABLE_OS_PROBER=false' >> /etc/default/grub
fi
grub2-mkconfig -o /boot/grub2/grub.cfg
echo "== regenerated grub.cfg: lines mentioning Windows: $(grep -c -i windows /boot/grub2/grub.cfg)"
grep -n -i -A8 "menuentry 'Windows" /boot/grub2/grub.cfg || true

# Boot marker: one row per Linux boot on the OEMDRV volume, so the host can
# count cycles without trusting screenshots.
mkdir -p /usr/local/sbin   # absent in the F42 chroot at %post time (seen 2026-08-27)
cat > /usr/local/sbin/v1b-mark <<'EOS'
#!/bin/bash
dev=/dev/disk/by-label/OEMDRV
for i in $(seq 1 30); do [ -e "$dev" ] && break; sleep 1; done
[ -e "$dev" ] || exit 0
mkdir -p /mnt/oemdrv
mount "$dev" /mnt/oemdrv || exit 0
cur=$(efibootmgr 2>/dev/null | awk '/BootCurrent/{print $2}')
sha=$(sha256sum /boot/efi/EFI/Microsoft/Boot/bootmgfw.efi 2>/dev/null | cut -c1-64)
free=$(df -B1 --output=avail /boot/efi | tail -1 | tr -d ' ')
printf 'linux-boot,%s,%s,BootCurrent=%s,bootmgfw_sha256=%s,esp_free=%s\n' \
    "$(date -u +%FT%TZ)" "$(uname -r)" "$cur" "$sha" "$free" >> /mnt/oemdrv/boots.log
auto=0; [ -e /mnt/oemdrv/autoshutdown ] && auto=1
sync; umount /mnt/oemdrv
[ "$auto" = 1 ] && systemctl poweroff
exit 0
EOS
chmod +x /usr/local/sbin/v1b-mark
cat > /etc/systemd/system/v1b-mark.service <<'EOS'
[Unit]
Description=V1b rig boot marker (writes a row to the OEMDRV volume)
After=multi-user.target
[Service]
Type=oneshot
ExecStart=/usr/local/sbin/v1b-mark
[Install]
WantedBy=multi-user.target
EOS
systemctl enable v1b-mark.service
echo "== MOK import (queue Windows Production PCA 2011 for enrolment)"
if [ -f /root/win-pca.der ]; then
    printf 'rigmok12\nrigmok12\n' | mokutil --import /root/win-pca.der && echo "mokutil: import queued" || echo "mokutil: import FAILED exit $?"
    mokutil --list-new 2>&1 | head -8 || true
else
    echo "win-pca.der missing - enrol by hand from the installed system"
fi
echo "== v1b %post done"
%end

%post --nochroot --log=/mnt/sysroot/root/v1b-post-nochroot.log
set -x
# Ship the evidence back to the host on the OEMDRV volume.
dev=/dev/disk/by-label/OEMDRV
mkdir -p /mnt/oemdrv
if ! mountpoint -q /mnt/oemdrv; then mount "$dev" /mnt/oemdrv; fi
cp /mnt/sysroot/root/v1b-post.log /mnt/oemdrv/v1b-post.log
mkdir -p /mnt/oemdrv/anaconda-logs
cp /tmp/anaconda.log /tmp/storage.log /tmp/program.log /tmp/packaging.log /mnt/oemdrv/anaconda-logs/ 2>/dev/null || true
cp /mnt/sysroot/root/anaconda-ks.cfg /mnt/oemdrv/anaconda-ks.cfg 2>/dev/null || true
cp /mnt/sysroot/boot/grub2/grub.cfg /mnt/oemdrv/grub.cfg 2>/dev/null || true
printf 'install-done,%s\n' "$(date -u +%FT%TZ)" >> /mnt/oemdrv/boots.log
sync; umount /mnt/oemdrv
%end
