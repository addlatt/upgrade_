[package]
name = "upgrade-harvest"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"

# The harvester in Rust (RISKS R32, docs/RUST-PORT.md step 3): the pure
# half (mappings, judgments), the filesystem reads, and the live half that
# writes the folder map the job writer reads. The binary `upgrade-harvest`
# is what runs on the stick. Harvest-UpgradeState.ps1 stays the harvester
# in use until its ledger lines all read `pass`.
[dependencies]
roxmltree = "0.21"
serde_json = { version = "1", features = ["preserve_order"] }
upgrade-scan = { path = "../scan" }

# the filesystem reads (src/folders.rs) and the live half (src/live.rs): Windows only
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_System_Threading", "Win32_System_RemoteDesktop"] }

[dev-dependencies]
regress = "0.10"
