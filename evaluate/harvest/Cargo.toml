[package]
name = "upgrade-harvest"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

# The harvester's pure half in Rust (RISKS R32, docs/RUST-PORT.md step 3).
# It judges and maps; it reads no machine yet. Harvest-UpgradeState.ps1 stays
# the harvester in use until its ledger lines all read `pass`.
[dependencies]
roxmltree = "0.21"

# the filesystem reads (src/folders.rs): Windows only
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "1"
regress = "0.10"
