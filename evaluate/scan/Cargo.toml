[package]
name = "upgrade-scan"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-only"

# The scanner in Rust (RISKS R32, docs/RUST-PORT.md): the judging half, the
# collectors (Windows only) and, since 0.3.0, the read-only diagnostics that
# were Diag-SecureBoot.ps1 and Diag-Smart.ps1 (`upgrade-scan diag`; 0.4.0
# adds `diag volume`, which was the inline PowerShell of DIAG-VOLUME.cmd).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regress = "0.10"
roxmltree = "0.21"
sha2 = "0.10"

# the live reads (src/collect): Windows only, through Microsoft's own bindings
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Wmi", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Registry", "Win32_System_Rpc", "Win32_System_Time", "Win32_System_EventLog", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_Shell"] }
