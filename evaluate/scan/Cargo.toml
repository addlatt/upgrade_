[package]
name = "upgrade-scan"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

# The scanner's judging half in Rust (RISKS R32, step 2 of docs/RUST-PORT.md).
# It decides; it does not read the machine yet. evaluate/windows/upgrade-scan.ps1
# stays the scanner in use until every line it earned in
# docs/validation-results/port-parity.csv reads `pass` here.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regress = "0.10"
roxmltree = "0.21"

# the live reads (src/collect): Windows only, through Microsoft's own bindings
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Wmi", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Registry", "Win32_System_Rpc", "Win32_System_Time", "Win32_System_EventLog", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_Storage_FileSystem", "Win32_Security"] }
