# upgrade_ / V0 handoff payload - the signed (shim) variant.
#
# shim verifies grubx64.efi, grub reads this file, and this file's whole job
# is to record that the firmware ran our one-time entry, then hand the
# machine back to Windows. It mirrors startup.nsh for the Shell payload.
#
# The record is a GRUB environment block: EFI/BOOT/grubenv on this stick,
# pre-created as a clean 1024-byte block (Test-Handoff.ps1 -Arm resets it;
# make-kit.sh ships it). save_env rewrites the block in place, which is the
# only write GRUB can do to a FAT volume. Keep the variable name in sync with
# $GrubFiredVar in Test-Handoff.ps1.
#
# Nothing here depends on the marker succeeding: if save_env is refused, the
# reboot still happens and the harness classifies the run as 'ignored' -
# fail-safe, never a false pass.

set timeout=0
set upg_fired=1
save_env upg_fired
echo "upgrade_ V0: handoff fired (signed path). Returning to Windows in 3 seconds."
sleep 3
reboot
