# upgrade_ handoff payload - the signed (shim) variant.
#
# shim verifies grubx64.efi, grub reads this file. Its first job is to
# record that the firmware ran our one-time entry: a GRUB environment block,
# EFI/BOOT/grubenv on this stick, pre-created as a clean 1024-byte block
# (Test-Handoff.ps1 -Arm resets it; make-kit.sh ships it). save_env rewrites
# the block in place, the only write GRUB can do to a FAT volume. Keep the
# variable name in sync with $GrubFiredVar in Test-Handoff.ps1.
#
# Then one of two things, decided by a marker file the stick's author puts
# beside the kickstart (never by anything on the internal disk):
#
#   /upgrade_/boot-verify present  -> V1, reversible half: boot the Fedora
#       installer from this stick with upg.mode=verify; its %pre runs
#       upgrade_/linux/verify.sh (identity + hardware + storage), writes the
#       report under /upgrade_/report/ and reboots. Nothing is installed.
#   otherwise                       -> V0: say so and reboot to Windows.
#
# Nothing here depends on the marker succeeding: if save_env is refused the
# machine still comes back, and the harness classifies the run as 'ignored'
# - fail-safe, never a false pass.

set timeout=0
set upg_fired=1
save_env upg_fired

if [ -f /upgrade_/boot-verify ]; then
    echo "upgrade_ V1: handoff fired. Booting the verifier (nothing will be installed)."
    linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=UPGV0 inst.ks=hd:LABEL=UPGV0:/upgrade_/ks.cfg inst.text upg.mode=verify
    initrdefi /images/pxeboot/initrd.img
    boot
fi

echo "upgrade_ V0: handoff fired (signed path). Returning to Windows in 3 seconds."
sleep 3
reboot
