# upgrade_ reclaim (RISKS R41, VALIDATION V15). This kickstart installs
# nothing: it has no storage, no image and no packages. grub.cfg starts it
# only on a converted stick that Linux's `settle-in reclaim arm` has marked
# (upgrade_/boot-reclaim). Its one step is settle-in's run, which checks
# everything once more, then deletes Windows, moves Linux into the space and
# restarts the computer; it never returns to the installer. If it cannot
# start, --erroronfail stops the installer here, with nothing written.
text
%pre --log=/tmp/upgrade_-reclaim.log --erroronfail
exec /run/install/repo/upgrade_/settle-in/settle-in reclaim run --stick /run/install/repo
%end
