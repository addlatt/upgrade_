# upgrade_ handoff payload - the stick's start menu when it carries Ubuntu
# (roadmap item 23; RISKS R40, R45).
#
# Ubuntu's signed GRUB on the stick reads /boot/grub/grub.cfg, where its own
# disc keeps one. make-kit.sh puts this file there on every kit, and
# upgrade-fetch leaves the disc's own menu out, so the stick never offers
# "Try or Install Ubuntu". On a stick that carries Fedora nothing reads it
# (Fedora's GRUB reads EFI/BOOT/grub.cfg, the file beside this one in the
# repo).
#
# The branches are grub.cfg's, in the same order, decided by the same marker
# files under /upgrade_/ on the stick, never by anything on the internal
# disk:
#
#   /upgrade_/converted     -> this stick has converted a computer: hand over
#       to the system on the internal drive, never start the installer again.
#   /upgrade_/boot-verify   -> start the installer with upg.mode=verify: the
#       early check reports and restarts, nothing is installed.
#   /upgrade_/boot-install  -> the conversion.
#   otherwise               -> say so and restart.
#
# The installer is told `autoinstall`, so it asks nothing; the stick's own
# /autoinstall.yaml names no disk at all, and only `upgrade-installer early`
# can replace it with one that does (R45). Both markers start the same
# installer: the difference is the early check's, not this file's.
#
# Reclaim (R41) is not built for an Ubuntu stick: there is no branch for
# /upgrade_/boot-reclaim here, so the marker starts nothing.
#
# The mark: the same block the Fedora menu writes, EFI/BOOT/grubenv, named
# in full because this GRUB's own folder is /boot/grub. Nothing depends on
# the write succeeding (grub.cfg, "fail-safe, never a false pass").

set timeout=0
set upg_fired=1
save_env --file /EFI/BOOT/grubenv upg_fired

if [ -f /upgrade_/converted ]; then
    echo "upgrade_: this computer is already converted. Starting it. You can take the USB stick out."
    if search --no-floppy --file --set=upg_esp /EFI/ubuntu/shimx64.efi; then
        chainloader ($upg_esp)/EFI/ubuntu/shimx64.efi
        boot
    fi
    echo "upgrade_: the installed system was not found from here. Take the USB stick out and restart."
    sleep 10
    exit
fi

if [ -f /upgrade_/boot-verify ]; then
    echo "upgrade_: handoff fired. Starting the check (nothing will be installed)."
    set gfxpayload=keep
    linux  /casper/vmlinuz autoinstall upg.mode=verify ---
    initrd /casper/initrd
    boot
fi

if [ -f /upgrade_/boot-install ]; then
    echo "upgrade_: handoff fired. Starting the installer."
    set gfxpayload=keep
    linux  /casper/vmlinuz autoinstall ---
    initrd /casper/initrd
    boot
fi

echo "upgrade_: handoff fired (Ubuntu stick). Returning to Windows in 3 seconds."
sleep 3
reboot
