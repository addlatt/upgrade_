[package]
name = "upgrade-window"
version = "0.4.0"
edition = "2024"

[[bin]]
name = "UPGRADE"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["glow", "wgpu", "default_fonts", "accesskit"] }
serde_json = "1"
# the Linux password is hashed in the window (Read-Password.ps1's rules and the
# job writer's sha512-crypt), and the typed sentences are the job writer's own
upgrade-job = { path = "../../../evaluate/job" }
# the picker (roadmap item 24): the releases the kit's table offers, and the
# fetcher's progress lines; the table is the scanner's own compiled copy
upgrade-fetch = { path = "../../../evaluate/fetch" }
upgrade-scan = { path = "../../../evaluate/scan" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# the release profile lives in the workspace root (Cargo.toml at the repo root)

# off Windows (tests on the Linux side): winit needs a display backend to build
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["glow", "wgpu", "default_fonts", "accesskit", "x11"] }
