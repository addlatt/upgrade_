[package]
name = "upgrade-gate"
version = "0.3.1"
edition = "2024"

# The gate on a "Go back to Windows" stick (RISKS R33): it runs first inside
# Windows Setup's own environment (WinPE), finds the drives the job names,
# and holds the countdown that is the commit line.
[[bin]]
name = "upgrade-gate"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Console", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = "s"
strip = true

# its own workspace root: a checkout under another repository (a worktree under .claude/worktrees/)
# must not fall into that repository's root workspace (cargo searches upward; 2026-10-10)
[workspace]
