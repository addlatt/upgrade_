[package]
name = "settle-in"
version = "0.11.1"
edition = "2024"

[dependencies]
libc = "0.2"
ntfs = "0.4"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "std"] }
regress = "0.10"
roxmltree = "0.21"
serde_json = "1"
sha2 = "0.10"
tz-rs = "0.7"

# its own workspace root: a checkout under another repository (a worktree under .claude/worktrees/)
# must not fall into that repository's root workspace (cargo searches upward; 2026-10-10)
[workspace]
